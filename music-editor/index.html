<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Editor</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#16181d">
  <script>
    // Apply the saved theme before the page paints (no light flash). Dark by default.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('music-editor-theme') || 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #16181d;
      --surface: #1f2229;
      --surface-hover: #2a2e37;
      --border: #343944;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --faint: #6b7280;
      --ink: #e6e8ec;        /* notation */
      --accent: #ff5f52;     /* marker + playing notes */
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-hover: #eeeeee;
      --border: #d4d4d4;
      --text: #222222;
      --muted: #555555;
      --faint: #999999;
      --ink: #111111;
      --accent: #d93025;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.2rem; margin: 0 12px 0 0; }
    header a { color: var(--muted); font-size: 0.9rem; }
    button {
      font: inherit;
      color: var(--text);
      padding: 8px 16px;
      min-width: 96px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
    }
    @media (hover: hover) { button:hover:not(:disabled) { background: var(--surface-hover); } }
    button:active:not(:disabled) { background: var(--surface-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
    #btn-theme { min-width: 0; padding: 8px 12px; margin-left: auto; }
    #status { color: var(--muted); font-size: 0.9rem; }
    #version { color: var(--faint); font-size: 0.8rem; }
    main { padding: 16px; }
    #score-wrap {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      overflow: hidden;
    }
    /* Verovio draws in the SVG's colour (currentColor). */
    #score svg { color: var(--ink); fill: var(--ink); }
    #score svg { display: block; }
    #cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      background: var(--accent);
      pointer-events: none;
      display: none;
      /* Own GPU layer: moving it never repaints the score. */
      will-change: transform;
      transform-origin: 0 0;
    }
    #score g.note.playing, #score g.note.playing * { fill: var(--accent); stroke: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Music Editor</h1>
    <button id="btn-playstop" disabled>Play</button>
    <button id="btn-playpause" disabled>Play</button>
    <span id="status">Loading score engine…</span>
    <span id="version">v10 · piano</span>
    <a href="../">← Home</a>
    <button id="btn-theme" type="button" aria-label="Switch theme"></button>
  </header>
  <main>
    <div id="score-wrap">
      <div id="score"></div>
      <div id="cursor"></div>
    </div>
  </main>

  <script>
    // Sample music (Beethoven, "Ode to Joy" — public domain), in ABC notation.
    const SAMPLE_ABC = `X:1
T:Ode to Joy
C:Ludwig van Beethoven
M:4/4
L:1/4
Q:1/4=120
K:D
|F F G A|A G F E|D D E F|F3/2 E/ E2|
F F G A|A G F E|D D E F|E3/2 D/ D2|
E E F D|E F/G/ F D|E F/G/ F E|D E A,2|
F F G A|A G F E|D D E F|E3/2 D/ D2|]`;

    const scoreEl = document.getElementById('score');
    const wrapEl = document.getElementById('score-wrap');
    const cursorEl = document.getElementById('cursor');
    const btnPlayStop = document.getElementById('btn-playstop');
    const btnPlayPause = document.getElementById('btn-playpause');
    const statusEl = document.getElementById('status');
    const headerEl = document.querySelector('header');
    const noteEls = new Map();  // note id -> SVG element (refreshed on render)

    let tk = null;
    let notes = [];     // { id, start, end, pitch } — times in seconds
    let onsets = [];    // { t, ids, x, top, bottom, systemRight } sorted by t
    let totalDuration = 0;

    // ---------- Playback state ----------
    let audioCtx = null;
    let state = 'stopped';     // 'stopped' | 'playing' | 'paused'
    let offset = 0;            // position in seconds where playback (re)starts
    let ctxStartTime = 0;      // audioCtx.currentTime corresponding to `offset`
    let activeNodes = [];
    let rafId = null;

    let masterGain = null;

    // Play through the phone's silent/ring switch (iOS) while still following
    // the hardware volume: the "playback" audio session is what music apps use.
    if (navigator.audioSession) {
      try { navigator.audioSession.type = 'playback'; } catch (e) {}
    }

    // Belt and braces (and the only fix on iOS < 17): a playing <audio>
    // element also switches the page into the "playback" category, so we
    // loop a tiny silent clip while the music is playing.
    const silentAudio = (() => {
      const rate = 8000, len = rate / 2;
      const buf = new ArrayBuffer(44 + len);
      const v = new DataView(buf);
      const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); v.setUint32(4, 36 + len, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true);
      v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, len, true);
      for (let i = 0; i < len; i++) v.setUint8(44 + i, 128);
      const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
      a.loop = true;
      a.setAttribute('playsinline', '');
      return a;
    })();

    // The AudioContext is created right away (suspended) so the piano samples
    // can be downloaded and decoded before the user ever presses Play.
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.9;
        masterGain.connect(audioCtx.destination);
        audioCtx.onstatechange = () => {
          // iOS: 'interrupted' (call, Siri, other app took audio, long idle)
          // or 'closed' by the system. Stop cleanly so the UI stays usable.
          if (audioDead() && state === 'playing') pause();
        };
      }
      return audioCtx;
    }

    // A context the system has closed or interrupted can't be revived
    // reliably on iOS, so it is replaced. Decoded piano samples are plain
    // AudioBuffers and work in the new context, so nothing is re-downloaded.
    function audioDead() {
      return !audioCtx || audioCtx.state === 'closed' || audioCtx.state === 'interrupted';
    }

    function resetAudio() {
      for (const n of activeNodes) { try { n.stop(); n.disconnect(); } catch (e) {} }
      activeNodes = [];
      if (audioCtx) {
        audioCtx.onstatechange = null;
        if (audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
      }
      audioCtx = null;
      masterGain = null;
    }

    // Browsers only let audio start inside a user gesture. Unlock on every
    // gesture type until it works (on phones, a touch "pointerdown" alone
    // does not count, so touchend/click are needed too).
    function unlockAudio() {
      if (audioDead()) resetAudio();
      const ctx = getAudioCtx();
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
      if (silentAudio && state === 'playing' && silentAudio.paused) silentAudio.play().catch(() => {});
    }
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
      window.addEventListener(ev, unlockAudio, { capture: true, passive: true });
    }

    // ---------- Sleep / wake ----------
    // When the tab goes to the background (app switch, screen lock), pause:
    // iOS stops the audio anyway. When it comes back after a while, start
    // with a fresh audio context (iOS often leaves the old one silently
    // broken), ready for the next tap on Play.
    let hiddenAt = 0;
    function onHide() {
      if (!hiddenAt) hiddenAt = performance.now();
      if (state === 'playing') pause();
      if (silentAudio) silentAudio.pause();
    }
    function onWake() {
      const away = hiddenAt ? performance.now() - hiddenAt : 0;
      hiddenAt = 0;
      if (audioCtx && (audioDead() || away > 30000)) {
        resetAudio();
        getAudioCtx();  // created suspended; the next tap resumes it
      }
    }
    document.addEventListener('visibilitychange', () => document.hidden ? onHide() : onWake());
    window.addEventListener('pagehide', onHide);
    window.addEventListener('pageshow', e => { if (e.persisted) hiddenAt = hiddenAt || 1; onWake(); });

    // ---------- Rendering ----------
    function render() {
      const width = Math.max(300, wrapEl.clientWidth - 16);
      const scale = width < 600 ? 30 : 40;
      tk.setOptions({
        scale,
        pageWidth: Math.round(width * 100 / scale),
        pageMarginLeft: 20, pageMarginRight: 20, pageMarginTop: 20, pageMarginBottom: 20,
        adjustPageHeight: true,
        breaks: 'auto',
        footer: 'none',
      });
      tk.redoLayout();
      let svg = '';
      for (let p = 1; p <= tk.getPageCount(); p++) svg += tk.renderToSVG(p);
      scoreEl.innerHTML = svg;
      computeOnsetPositions();
      lastSystem = null;
      buildMarkerAnimation();
    }

    function buildTiming() {
      const timemap = tk.renderToTimemap();
      const starts = {};
      notes = [];
      onsets = [];
      for (const e of timemap) {
        const t = e.tstamp / 1000;
        if (e.on && e.on.length) {
          for (const id of e.on) starts[id] = t;
          onsets.push({ t, ids: e.on });
        }
        if (e.off) {
          for (const id of e.off) {
            if (starts[id] === undefined) continue;
            const midi = tk.getMIDIValuesForElement(id);
            notes.push({ id, start: starts[id], end: t, pitch: midi.pitch });
          }
        }
        totalDuration = Math.max(totalDuration, t);
      }
      notes.sort((a, b) => a.start - b.start);
    }

    // Measure where each onset sits on screen (relative to #score-wrap).
    function computeOnsetPositions() {
      const wrapRect = wrapEl.getBoundingClientRect();
      noteEls.clear();
      for (const n of notes) noteEls.set(n.id, document.getElementById(n.id));
      highlighted.forEach(id => noteEls.get(id)?.classList.add('playing'));
      for (const o of onsets) {
        const el = document.getElementById(o.ids[0]);
        if (!el) continue;
        const head = el.querySelector('.notehead') || el;
        const r = head.getBoundingClientRect();
        const system = el.closest('g.system');
        const sr = (system || el).getBoundingClientRect();
        // End of the line = right edge of the line's last measure (its barline).
        const measures = system ? system.querySelectorAll('g.measure') : [];
        const lastMeasure = measures[measures.length - 1];
        const lr = lastMeasure ? lastMeasure.getBoundingClientRect() : sr;
        o.system = system;
        o.x = r.left + r.width / 2 - wrapRect.left;
        o.top = sr.top - wrapRect.top - 6;
        o.bottom = sr.bottom - wrapRect.top + 6;
        o.systemRight = lr.right - wrapRect.left;
      }
    }

    // ---------- Cursor ----------
    // The marker is driven by ONE Web Animation covering the whole piece:
    // a keyframe at every note (linear glide between them), a keyframe at
    // each line end, and an almost-instant step to the next line. The
    // browser's compositor runs it on its own thread, so it stays smooth on
    // iPhone even when the page's JavaScript is busy (garbage collection,
    // repainting a highlighted note, touch handling). JavaScript only aligns
    // the animation's start time with the audio, and does the note colouring
    // and scrolling, which are not frame-critical.
    function findOnsetIndex(t) {
      let lo = 0, hi = onsets.length - 1, ans = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (onsets[mid].t <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return ans;
    }

    let markerAnim = null;   // exists only while playing
    let markerFrames = [];   // { t (s), x, y, s (scaleY) }
    let markerH = 0;

    const markerTransform = f =>
      `translate3d(${(f.x - 1).toFixed(2)}px, ${f.y.toFixed(2)}px, 0) scaleY(${f.s.toFixed(4)})`;

    // Marker position at time t, computed directly (used while paused).
    function markerFrameAt(t) {
      const F = markerFrames;
      if (t <= F[0].t) return F[0];
      for (let i = 1; i < F.length; i++) {
        if (F[i].t >= t) {
          const a = F[i - 1], b = F[i];
          if (a.y !== b.y) return t < b.t ? a : b;  // line change: hold, then jump
          const f = b.t > a.t ? (t - a.t) / (b.t - a.t) : 1;
          return { t, x: a.x + (b.x - a.x) * f, y: a.y, s: a.s };
        }
      }
      return F[F.length - 1];
    }

    function buildMarkerAnimation() {
      markerFrames = [];
      const placed = onsets.filter(o => o.x !== undefined);
      if (!placed.length || !totalDuration) return;
      markerH = Math.max(...placed.map(o => o.bottom - o.top));
      cursorEl.style.height = markerH + 'px';
      const D = totalDuration;
      const frames = markerFrames;
      const kf = (t, x, o) => frames.push({
        t: Math.min(D, Math.max(0, t)), x, y: o.top, s: (o.bottom - o.top) / markerH,
      });
      kf(0, placed[0].x, placed[0]);
      for (let i = 0; i < placed.length; i++) {
        const a = placed[i], b = placed[i + 1];
        kf(a.t, a.x, a);
        const sameLine = b && Math.abs(b.top - a.top) < 2 && b.x > a.x;
        if (!sameLine) {
          // Glide to the end of the line, then step (1 ms) to the next line.
          const endT = b ? b.t : D;
          kf(Math.max(a.t, endT - 0.001), Math.max(a.x, a.systemRight - 2), a);
        }
      }
      const last = placed[placed.length - 1];
      kf(D, Math.max(last.x, last.systemRight - 2), last);  // hold at the final barline
      frames.sort((p, q) => p.t - q.t);
      syncMarker();
    }

    // Put the marker in the state matching the transport.
    // Safari does not reliably restart a paused Web Animation, so we never
    // pause one: playing = a brand-new running animation; paused = a plain
    // static transform; stopped = hidden.
    function syncMarker() {
      if (markerAnim) { markerAnim.cancel(); markerAnim = null; }
      if (state === 'stopped' || !markerFrames.length) {
        cursorEl.style.display = 'none';
        return;
      }
      cursorEl.style.transform = markerTransform(markerFrameAt(offset));
      cursorEl.style.display = 'block';
      if (state === 'playing' && markerLive) {
        const D = totalDuration;
        markerAnim = cursorEl.animate(
          markerFrames.map(f => ({ offset: f.t / D, transform: markerTransform(f) })),
          { duration: D * 1000, easing: 'linear', fill: 'both' });
        alignMarker();
      }
    }

    // Set the running animation's position from the audio anchor. Uses
    // currentTime (works everywhere) rather than startTime.
    function alignMarker() {
      if (!markerAnim) return;
      const nowMs = document.timeline.currentTime ?? performance.now();
      markerAnim.currentTime = Math.max(offset * 1000, nowMs - perfAtStart + offset * 1000);
    }

    let lastIdx = -1;
    let lastSystem = null;
    // Non frame-critical work: note colouring and keeping the line in view.
    function followPosition(t) {
      if (!onsets.length) return;
      const i = findOnsetIndex(t);
      const a = onsets[i];
      if (a.system !== lastSystem) {
        lastSystem = a.system;
        const top = wrapEl.getBoundingClientRect().top + a.top;
        const headerH = headerEl.offsetHeight;
        if (top < headerH || top + (a.bottom - a.top) > window.innerHeight) {
          window.scrollBy(0, top - headerH - 40);  // jump, no animation
        }
      }
      if (i !== lastIdx) {
        lastIdx = i;
        highlight(t);
      }
    }

    // Toggle only the notes whose state changed (no DOM-wide queries).
    let highlighted = new Set();
    function highlight(t) {
      const now = new Set();
      for (const n of notes) {
        if (n.start > t) break;
        if (n.end > t) now.add(n.id);
      }
      for (const id of highlighted) if (!now.has(id)) noteEls.get(id)?.classList.remove('playing');
      for (const id of now) if (!highlighted.has(id)) noteEls.get(id)?.classList.add('playing');
      highlighted = now;
    }

    function clearHighlights() {
      for (const id of highlighted) noteEls.get(id)?.classList.remove('playing');
      highlighted = new Set();
      lastIdx = -1;
      lastSystem = null;
    }

    // Exact position on the audio clock (used for pause/resume logic).
    function currentPosition() {
      if (state === 'playing') return offset + (audioCtx.currentTime - ctxStartTime);
      return offset;
    }

    // ---- Aligning the marker with the audio ----
    // perfAtStart = performance.now() (ms) at which position `offset` is
    // actually heard. iPhone audio clocks report time in coarse, jittery
    // steps, so we never follow them frame by frame:
    //  1. "Locking" (first ~0.3 s of sound): take the median of the
    //     measurements, which throws away the jitter.
    //  2. Then: average the error and, if it exceeds 6 ms, glide the
    //     marker back in sync by at most 0.5 ms per frame (invisible).
    let perfAtStart = 0;
    let markerLive = false;   // true once the audio has actually started
    let lastCtxTime = -1;
    let stuckSince = 0;
    let lockSamples = [];
    let errAvg = 0;

    function measureAnchor() {
      const ts = audioCtx.getOutputTimestamp ? audioCtx.getOutputTimestamp() : null;
      const latency = (audioCtx.outputLatency || audioCtx.baseLatency || 0) * 1000;
      const fallback = performance.now() + (ctxStartTime - audioCtx.currentTime) * 1000 + latency;
      if (ts && ts.performanceTime > 0 && ts.contextTime > 0) {
        const precise = ts.performanceTime + (ctxStartTime - ts.contextTime) * 1000;
        // A fresh context can report a stale timestamp; only trust a sane one.
        if (Math.abs(precise - fallback) < 250) return precise;
      }
      return fallback;
    }

    function visualPosition(now) {
      if (state === 'playing' && !markerLive) return offset;
      return Math.max(offset, offset + (now - perfAtStart) / 1000);
    }

    function setAnchor(v) {
      perfAtStart = v;
      alignMarker();
    }

    function tick(now) {
      // Watchdog: audio that never starts, or whose clock stopped moving
      // (iOS can leave a "running" context frozen after a long idle).
      // Give up after 1.5 s, replace the audio, and let the next tap play.
      const ctxNow = audioCtx.currentTime;
      if (ctxNow !== lastCtxTime) {
        lastCtxTime = ctxNow;
        stuckSince = 0;
      } else if (!stuckSince) {
        stuckSince = now;
      } else if (now - stuckSince > 1500) {
        pause();
        resetAudio();
        statusEl.textContent = 'Audio was asleep — tap Play again';
        return;
      }
      if (!markerLive) {
        // Hold the marker still until the audio is really playing: the
        // context is running AND its clock has reached the first note.
        // A freshly created context (after sleep) can take a while to
        // start; moving early would make the marker run ahead and snap back.
        if (audioCtx.state === 'running' && ctxNow >= ctxStartTime) {
          markerLive = true;
          perfAtStart = measureAnchor();
          lockSamples = [];
          errAvg = 0;
          syncMarker();
        }
      } else if (lockSamples.length < 20) {
        lockSamples.push(measureAnchor());
        const sorted = [...lockSamples].sort((p, q) => p - q);
        const med = sorted[sorted.length >> 1];
        if (Math.abs(med - perfAtStart) > 1) setAnchor(med);
      } else {
        // Averaged error; if it exceeds 6 ms, slew towards it by at most
        // 0.5 ms per frame (invisible) instead of jumping.
        errAvg += (measureAnchor() - perfAtStart - errAvg) * 0.02;
        if (Math.abs(errAvg) > 6) {
          const step = Math.max(-0.5, Math.min(0.5, errAvg));
          setAnchor(perfAtStart + step);
          errAvg -= step;
        }
      }
      const t = visualPosition(now);
      if (t >= totalDuration + 0.15) { stop(); return; }
      // A new animation starts one frame late; keep it on the clock.
      if (markerAnim && markerAnim.currentTime !== null &&
          Math.abs(markerAnim.currentTime - t * 1000) > 2) {
        markerAnim.currentTime = t * 1000;
      }
      followPosition(t);
      rafId = requestAnimationFrame(tick);
    }

    // ---------- Piano (Salamander Grand Piano samples) ----------
    // One sample every 3 semitones from A0 (21) to C8 (108); other notes are
    // pitch-shifted from the nearest sample. Only the samples the score needs
    // are downloaded, and they are decoded before Play is pressed.
    const NOTE_NAMES = ['C', 'Cs', 'D', 'Ds', 'E', 'F', 'Fs', 'G', 'Gs', 'A', 'As', 'B'];
    const samples = {};        // sample midi -> Promise<AudioBuffer>
    const sampleBuffers = {};  // sample midi -> AudioBuffer (once decoded)

    function sampleFor(midi) {
      const m = Math.min(108, Math.max(21, midi));
      return 21 + Math.round((m - 21) / 3) * 3;
    }

    function loadSample(sm) {
      if (!samples[sm]) {
        const name = NOTE_NAMES[sm % 12] + (Math.floor(sm / 12) - 1);
        samples[sm] = fetch(`piano/${name}.mp3`)
          .then(r => r.arrayBuffer())
          .then(data => new Promise((ok, fail) => getAudioCtx().decodeAudioData(data, ok, fail)))
          .then(buf => (sampleBuffers[sm] = buf));
      }
      return samples[sm];
    }

    function loadSamplesForScore() {
      const needed = new Set(notes.map(n => sampleFor(n.pitch)));
      return Promise.all([...needed].map(loadSample));
    }

    function scheduleNote(midi, when, dur, skip = 0) {
      const sm = sampleFor(midi);
      const buf = sampleBuffers[sm];
      if (!buf) return;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = Math.pow(2, (midi - sm) / 12);
      const gain = audioCtx.createGain();
      src.connect(gain).connect(masterGain);
      const noteEnd = when + Math.max(0.05, dur);
      const release = 0.12;
      gain.gain.setValueAtTime(1, when);
      gain.gain.setValueAtTime(1, noteEnd);
      gain.gain.setTargetAtTime(0, noteEnd, release / 3);   // key released: damper
      src.start(when, Math.min(skip * src.playbackRate.value, buf.duration - 0.01));
      src.stop(noteEnd + release + 0.05);
      activeNodes.push(src);
    }

    function stopAllNodes() {
      for (const n of activeNodes) { try { n.stop(); n.disconnect(); } catch (e) {} }
      activeNodes = [];
      if (silentAudio) silentAudio.pause();
    }

    // ---------- Transport ----------
    function startAudio() {
      unlockAudio();
      // Start almost immediately; a tiny lead keeps the first attack click-free.
      ctxStartTime = audioCtx.currentTime + 0.01;
      markerLive = false;
      perfAtStart = measureAnchor();
      lockSamples = [];
      errAvg = 0;
      stuckSince = 0;
      for (const n of notes) {
        if (n.end <= offset) continue;
        const start = Math.max(n.start, offset);
        // Resuming in the middle of a note: start the sample part-way through.
        scheduleNote(n.pitch, ctxStartTime + (start - offset), n.end - start, start - n.start);
      }
    }

    function play() {
      if (!tk || state === 'playing') return;
      if (offset >= totalDuration) offset = 0;
      try {
        startAudio();
      } catch (err) {
        // The audio context broke while idle: replace it and try once more.
        console.warn('Audio restart', err);
        resetAudio();
        startAudio();
      }
      state = 'playing';
      if (silentAudio) silentAudio.play().catch(() => {});
      syncMarker();
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
      updateButtons();
    }

    function pause() {
      if (state !== 'playing') return;
      // Pause where the listener is (what's heard / where the marker is).
      offset = Math.min(currentPosition(), visualPosition(performance.now()));
      stopAllNodes();
      cancelAnimationFrame(rafId);
      state = 'paused';
      syncMarker();
      followPosition(offset);
      updateButtons();
    }

    function stop() {
      stopAllNodes();
      cancelAnimationFrame(rafId);
      state = 'stopped';
      offset = 0;
      syncMarker();
      clearHighlights();
      updateButtons();
    }

    function updateButtons() {
      btnPlayStop.textContent = state === 'playing' ? 'Stop' : 'Play';
      btnPlayPause.textContent = state === 'playing' ? 'Pause' : (state === 'paused' ? 'Resume' : 'Play');
      statusEl.textContent = state === 'playing' ? 'Playing' : (state === 'paused' ? 'Paused' : 'Ready');
    }

    // Button 1: Play / Stop (stop returns to the beginning)
    btnPlayStop.addEventListener('pointerdown', e => { e.preventDefault(); state === 'playing' ? stop() : play(); });
    // Button 2: Play / Pause (pause keeps the position)
    btnPlayPause.addEventListener('pointerdown', e => { e.preventDefault(); state === 'playing' ? pause() : play(); });
    // Keyboard access (Enter/Space) still goes through click.
    for (const b of [btnPlayStop, btnPlayPause]) {
      b.addEventListener('click', e => { if (e.detail === 0) b.dispatchEvent(new PointerEvent('pointerdown')); });
    }
    // Space bar = play/pause.
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        state === 'playing' ? pause() : play();
      }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => tk && render(), 150);
    });

    // ---------- Theme ----------
    const btnTheme = document.getElementById('btn-theme');
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      btnTheme.textContent = t === 'dark' ? '☀︎ Light' : '☾ Dark';
      document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#16181d' : '#ffffff';
    }
    applyTheme(document.documentElement.dataset.theme || 'dark');
    btnTheme.addEventListener('click', () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(t);
      try { localStorage.setItem('music-editor-theme', t); } catch (e) {}
    });

    // ---------- Init ----------
    function init() {
      tk = new verovio.toolkit();
      tk.setOptions({ inputFrom: 'abc' });
      tk.loadData(SAMPLE_ABC);
      render();
      buildTiming();
      computeOnsetPositions();
      buildMarkerAnimation();
      statusEl.textContent = 'Loading piano…';
      loadSamplesForScore().then(() => {
        btnPlayStop.disabled = false;
        btnPlayPause.disabled = false;
        updateButtons();
      }).catch(err => {
        statusEl.textContent = 'Could not load piano sounds';
        console.error(err);
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/verovio@6.3.0/dist/verovio-toolkit-wasm.js"></script>
  <script>
    verovio.module.onRuntimeInitialized = init;
  </script>
</body>
</html>
